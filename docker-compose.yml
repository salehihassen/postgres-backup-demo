services:
  db:
    container_name: "postgres"
    image: postgres:16
    env_file: ".env"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./modified_avocado_prices.csv:/docker-entrypoint-initdb.d/modified_avocado_prices.csv:ro
    networks:
      demo_net:
        ipv4_address: 172.18.0.10
  pgdump-cron:
    build: 
      context: .
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: pgdump_cron
    depends_on:
      - db
    volumes:
      - ./backups:/backups
      - ./pgdump-cron.sh:/usr/local/bin/pgdump-cron.sh
    entrypoint: ["/bin/sh", "-c", "crond -f -l 2"]
    env_file: ".env"
    networks:
      demo_net:
        ipv4_address: 172.18.0.20

volumes:
  pgdata:
  
networks:
  demo_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16
